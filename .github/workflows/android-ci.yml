name: LoanJB Android CI

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-verify:
    name: Lint, Tests, Coverage, Debug APK & Release R8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Run ktlint static analysis
        run: ./gradlew :app:ktlintCheck --console=plain

      - name: Ensure debug.keystore exists for CI
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit, Robolectric UI, Migration & Benchmark Tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Generate JaCoCo Code Coverage Report
        run: ./gradlew :app:jacocoTestReport --console=plain

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Verify Release R8 Minification & Bundle (throwaway CI key)
        run: |
          TMP_KEYSTORE="${RUNNER_TEMP}/ci-release-upload.jks"
          TMP_PASS="ci-throwaway-$(date +%s)"
          keytool -genkey -v \
            -keystore "${TMP_KEYSTORE}" \
            -storepass "${TMP_PASS}" \
            -alias upload \
            -keypass "${TMP_PASS}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=LoanJB CI,O=LoanJB,C=IN"
          KEYSTORE_PATH="${TMP_KEYSTORE}" \
          STORE_PASSWORD="${TMP_PASS}" \
          KEY_PASSWORD="${TMP_PASS}" \
          ./gradlew :app:minifyReleaseWithR8 :app:bundleRelease --console=plain
          rm -f "${TMP_KEYSTORE}"

      - name: Upload Test, Coverage, Lint & ktlint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loanjb-ci-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/jacoco/jacocoTestReport/
            app/build/reports/lint-results-debug.html
            app/build/reports/ktlint/
            app/schemas/

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: loanjb-debug-apk
          path: app/build/outputs/apk/debug/*.apk
